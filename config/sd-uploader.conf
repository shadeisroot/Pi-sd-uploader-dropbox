# SD Uploader settings: /etc/sd-uploader/sd-uploader.conf
# Changes apply to the next card. For the LED settings, also run:
#   sudo systemctl restart sd-uploader-status
# One KEY=value per line; no comments on the same line as a value.

# Where photos go: the rclone remote that `sd-uploader setup` creates, plus an
# optional folder inside it, e.g. "dropbox:Camera". With an App-folder Dropbox
# app, dropbox: is Dropbox/Apps/<your app name>/.
REMOTE=dropbox:

# Folder for each file, from its shooting date: %Y = year, %m = month, %d = day.
# Examples: %Y/%m  ->  2026/07/      %Y/%Y-%m-%d  ->  2026/2026-07-14/
FOLDER_FORMAT=%Y/%m

# What happens on the card once every file is verified in Dropbox:
#   dry-run  only list what would be deleted (start here)
#   on       delete the verified photos and videos (folders and other files stay)
#   off      leave the card untouched
DELETE=dry-run

# Keep at least this much Dropbox space free, in GiB. If a card doesn't fit,
# nothing is uploaded and the light turns red.
MIN_FREE_GB=1

# Files uploaded at the same time.
TRANSFERS=4

# Status light:
#   gpio  red, blue and green LEDs on the pins below (BCM GPIO numbers)
#   act   the Pi's own green activity LED (no wiring)
#   none  no light
LED_BACKEND=gpio
LED_PIN_RED=17
LED_PIN_BLUE=23
LED_PIN_GREEN=22
