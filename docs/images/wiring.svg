<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>SD Uploader LED wiring</title>
  <rect x="0" y="0" width="760" height="400" rx="12" fill="#ffffff"/>

  <!-- GPIO header, pins 1-20 -->
  <text x="210" y="28" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">GPIO header, pins 1–20</text>
  <rect x="172" y="42" width="76" height="312" rx="8" fill="#1d6b45"/>
  <g fill="#c9a227" stroke="#8a6d10" stroke-width="1">
    <rect x="187" y="52" width="16" height="16" rx="2"/>
    <circle cx="225" cy="60" r="8"/>
    <circle cx="195" cy="90" r="8"/><circle cx="225" cy="90" r="8"/>
    <circle cx="195" cy="120" r="8"/><circle cx="225" cy="120" r="8"/>
    <circle cx="195" cy="150" r="8"/><circle cx="225" cy="150" r="8"/>
    <circle cx="225" cy="180" r="8"/>
    <circle cx="225" cy="210" r="8"/>
    <circle cx="195" cy="240" r="8"/>
    <circle cx="195" cy="300" r="8"/><circle cx="225" cy="300" r="8"/>
    <circle cx="195" cy="330" r="8"/>
  </g>
  <!-- used pins -->
  <circle cx="195" cy="180" r="9" fill="#1f2328" stroke="#e5484d" stroke-width="3"/>
  <circle cx="195" cy="210" r="9" fill="#e5484d"/>
  <circle cx="225" cy="240" r="9" fill="#1f2328" stroke="#3b82f6" stroke-width="3"/>
  <circle cx="195" cy="270" r="9" fill="#22c55e"/>
  <circle cx="225" cy="270" r="9" fill="#3b82f6"/>
  <circle cx="225" cy="330" r="9" fill="#1f2328" stroke="#22c55e" stroke-width="3"/>

  <!-- pin labels -->
  <g font-size="12" fill="#57606a">
    <text x="160" y="64" text-anchor="end">1</text>
    <text x="260" y="64">2</text>
  </g>
  <g font-size="13" fill="#1f2328">
    <text x="160" y="184" text-anchor="end"><tspan font-weight="600">9</tspan>  GND (red)</text>
    <text x="160" y="214" text-anchor="end"><tspan fill="#d93036" font-weight="600">GPIO17 → red</tspan>  <tspan font-weight="600">11</tspan></text>
    <text x="260" y="244"><tspan font-weight="600">14</tspan>  GND (blue)</text>
    <text x="160" y="274" text-anchor="end"><tspan fill="#15a34a" font-weight="600">GPIO22 → green</tspan>  <tspan font-weight="600">15</tspan></text>
    <text x="260" y="274"><tspan font-weight="600">16</tspan>  <tspan fill="#2563eb" font-weight="600">GPIO23 → blue</tspan></text>
    <text x="260" y="334"><tspan font-weight="600">20</tspan>  GND (green)</text>
  </g>
  <text x="210" y="378" font-size="12" fill="#57606a" text-anchor="middle">Pin 1 is the square pad, at the end farthest from the USB ports.</text>

  <!-- one LED circuit -->
  <text x="420" y="118" font-size="14" font-weight="600" fill="#1f2328">Each LED</text>
  <g stroke="#1f2328" stroke-width="2.5" fill="none">
    <line x1="430" y1="170" x2="478" y2="170"/>
    <line x1="538" y1="170" x2="584" y2="170"/>
    <line x1="618" y1="170" x2="672" y2="170"/>
  </g>
  <circle cx="430" cy="170" r="7" fill="#c9a227" stroke="#8a6d10"/>
  <rect x="478" y="158" width="60" height="24" rx="4" fill="#f6f1e3" stroke="#1f2328" stroke-width="2"/>
  <g fill="#8a5a2b"><rect x="490" y="158" width="5" height="24"/><rect x="503" y="158" width="5" height="24"/><rect x="516" y="158" width="5" height="24"/></g>
  <path d="M584 154 L584 186 L612 170 Z" fill="#e5484d" stroke="#1f2328" stroke-width="2"/>
  <line x1="614" y1="154" x2="614" y2="186" stroke="#1f2328" stroke-width="3"/>
  <circle cx="672" cy="170" r="7" fill="#1f2328"/>
  <g font-size="12" fill="#1f2328" text-anchor="middle">
    <text x="430" y="150">GPIO pin</text>
    <text x="508" y="150">resistor</text>
    <text x="600" y="146">LED</text>
    <text x="672" y="150">GND</text>
  </g>
  <g font-size="11" fill="#57606a" text-anchor="middle">
    <text x="566" y="208">long leg (+)</text>
    <text x="640" y="208">short leg (−)</text>
  </g>

  <!-- resistor table -->
  <g font-size="13" fill="#1f2328">
    <text x="420" y="262" font-weight="600">Resistors</text>
    <circle cx="428" cy="285" r="6" fill="#e5484d"/><text x="442" y="290">Red: 330 Ω (~4 mA)</text>
    <circle cx="428" cy="310" r="6" fill="#3b82f6"/><text x="442" y="315">Blue: 100 Ω (~3 mA)</text>
    <circle cx="428" cy="335" r="6" fill="#22c55e"/><text x="442" y="340">Green: 100 Ω (~3 mA)</text>
  </g>
  <text x="420" y="378" font-size="12" fill="#57606a">Never connect an LED to a GPIO pin without a resistor.</text>
</svg>
