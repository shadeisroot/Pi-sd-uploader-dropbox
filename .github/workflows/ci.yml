name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck -x install.sh uninstall.sh src/sd-uploader src/*.sh tests/e2e.sh
      - name: Python syntax
        run: python3 -m py_compile src/statusd.py

  e2e:
    name: End-to-end (FAT32 + exFAT)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libimage-exiftool-perl rclone dosfstools exfatprogs
      - name: Upload, verify and delete a fake camera card
        run: sudo tests/e2e.sh
